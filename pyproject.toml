[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "univercmp"
version = "0.2.0"
description = "Cross-platform package version comparison for APK, DEB and RPM ecosystems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["package", "version", "compare", "apk", "deb", "rpm", "alpine", "debian", "redhat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Software Distribution",
    "Topic :: Utilities",
]

[project.urls]
Homepage   = "https://github.com/Limozacloud/univercmp"
Repository = "https://github.com/Limozacloud/univercmp"
Issues     = "https://github.com/Limozacloud/univercmp/issues"

[project.scripts]
univercmp = "univercmp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["univercmp"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []
